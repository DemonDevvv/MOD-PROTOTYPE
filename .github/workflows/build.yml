name: Compilar Mod CubeForge

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar archivos del proyecto
        uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar archivo .jar
        run: gradle build --no-daemon

      - name: Guardar .jar listo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: golem_obsidiana-mod-jar
          path: build/libs/*.jar
